<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<body>
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <div class="alert alert-danger shadow p-5">
            <h1 class="display-4">Something Went Wrong</h1>
            <p class="lead mt-3" th:text="${errorMessage}">An unexpected error occurred.</p>
            <hr>
            <a th:href="@{/surveys}" class="btn btn-danger btn-lg mt-3">Go Home</a>
        </div>
    </div>
</div>
</body>
</html>
