<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div})}">
<body>
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="mb-4">
            <h2 th:text="${survey.title}" class="text-primary">Survey Title</h2>
            <p class="lead" th:text="${survey.description}">Survey Description</p>
            <hr>
        </div>

        <div th:if="${param.submitted}" class="alert alert-success shadow-sm mb-4">
            <h4 class="alert-heading">Success!</h4>
            <p class="mb-0">Thank you for your response! Your answers have been recorded.</p>
            <hr>
            <a th:href="@{/surveys}" class="btn btn-sm btn-success">View More Surveys</a>
        </div>

        <form th:unless="${param.submitted}" th:action="@{/surveys/{id}/respond(id=${survey.id})}" th:object="${responseDto}" method="post">
            <div th:each="q, iterStat : ${questions}" class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        <span th:text="${iterStat.count} + '. ' + ${q.text}">Question Text</span>
                    </h5>

                    <!-- TEXT Type -->
                    <div th:if="${q.type.name() == 'TEXT'}">
                        <input type="text" th:name="'answers[' + ${q.id} + ']'" class="form-control" placeholder="Your answer..." required>
                    </div>

                    <!-- RADIO Type -->
                    <div th:if="${q.type.name() == 'RADIO'}">
                        <!-- We assume options is a JSON array string like ["Yes", "No"] -->
                        <!-- In a real app we'd parse this in the service or use a converter -->
                        <!-- For this step-by-step, we'll use a simple thymeleaf utility or assume comma split for display -->
                        <div th:each="opt : ${#strings.arraySplit(#strings.substring(q.options, 1, #strings.length(q.options)-1), ',')}" class="form-check">
                            <input class="form-check-input" type="radio" th:name="'answers[' + ${q.id} + ']'" 
                                   th:value="${#strings.trim(#strings.replace(opt, '&quot;', ''))}" 
                                   th:id="'radio_' + ${q.id} + '_' + ${optStat.index}" required>
                            <label class="form-check-label" th:for="'radio_' + ${q.id} + '_' + ${optStat.index}" 
                                   th:text="${#strings.trim(#strings.replace(opt, '&quot;', ''))}">Option</label>
                        </div>
                    </div>

                    <!-- CHECKBOX Type -->
                    <div th:if="${q.type.name() == 'CHECKBOX'}">
                        <div th:each="opt : ${#strings.arraySplit(#strings.substring(q.options, 1, #strings.length(q.options)-1), ',')}" class="form-check">
                            <input class="form-check-input" type="checkbox" th:name="'answers[' + ${q.id} + ']'" 
                                   th:value="${#strings.trim(#strings.replace(opt, '&quot;', ''))}" 
                                   th:id="'check_' + ${q.id} + '_' + ${optStat.index}">
                            <label class="form-check-label" th:for="'check_' + ${q.id} + '_' + ${optStat.index}" 
                                   th:text="${#strings.trim(#strings.replace(opt, '&quot;', ''))}">Option</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mb-5">
                <button type="submit" class="btn btn-primary btn-lg">Submit Response</button>
                <a th:href="@{/surveys}" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
